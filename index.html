<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Le cinéma le plus proche, ses séances en temps réel, les notes presse et spectateurs et un conseil pour chaque film.">
<meta name="theme-color" content="#0d0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Klap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width app column — sticky location bar, nearest-cinema hero, day strip, film list; sheets slide up from the bottom. */
:root{
  --bg:#0d0e17; --surface:#171826; --surface-2:#20223a; --line:#2b2d48;
  --fg:#f1f0f7; --muted:#9a9bb5; --accent:#ffb547; --accent-ink:#1b1305;
  --good:#4fd18b; --ok:#a7d84f; --mid:#f2b84b; --bad:#ff6b6b; --none:#7c7e99;
  --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f3f8; --surface:#ffffff; --surface-2:#ececf4; --line:#dcdce8;
  --fg:#15162a; --muted:#62647f; --accent:#e58a00; --accent-ink:#ffffff;
  --good:#16a35a; --ok:#6a9d12; --mid:#c98700; --bad:#d93b3b; --none:#8a8ca6;
  --shadow:0 14px 34px -18px rgba(30,30,70,.35); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f3f8; --surface:#ffffff; --surface-2:#ececf4; --line:#dcdce8;
  --fg:#15162a; --muted:#62647f; --accent:#e58a00; --accent-ink:#ffffff;
  --good:#16a35a; --ok:#6a9d12; --mid:#c98700; --bad:#d93b3b; --none:#8a8ca6;
  --shadow:0 14px 34px -18px rgba(30,30,70,.35); color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{touch-action:pan-x pan-y}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;margin:0;background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body,button,a{-webkit-tap-highlight-color:transparent}
button,a,.chip,.day,.card,.loc{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
#scroller{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#scroller.locked{overflow:hidden}
body{margin:0;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
a{color:inherit}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}

/* top bar */
.top{position:relative;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{width:38px;height:38px;flex:none;display:block;border-radius:10px}
.loc{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.loc-ico{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--accent)}
.loc-txt{min-width:0}
.loc-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.loc-name{font-family:var(--f-display);font-weight:700;font-size:19px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--surface-2);padding:7px 10px;border-radius:10px;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.clock i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}

/* hero */
.hero{margin-top:6px;background:linear-gradient(140deg,var(--surface-2),var(--surface) 70%);border:1px solid var(--line);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 65%);pointer-events:none}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;margin:6px 0 4px;text-wrap:balance;letter-spacing:-.01em}
.hero-meta{color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 12px}
.hero-meta b{color:var(--fg);font-weight:600}
.hero-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;font-weight:600;font-size:13.5px;text-decoration:none;background:var(--bg);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}

.cine-strip{overscroll-behavior-x:contain;display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;margin:0 -2px;scrollbar-width:none}
.cine-strip::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

/* days + tools */
.days{overscroll-behavior-x:contain;display:flex;gap:8px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:64px;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center}
.day b{display:block;font-family:var(--f-display);font-size:15px}
.day span{font-size:11.5px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.8}
.day:disabled{opacity:.35;cursor:default}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.tools h2{font-family:var(--f-display);font-size:20px;margin:0}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:6px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filters .chip{padding:6px 11px;font-size:12.5px}

/* film card */
.list{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:92px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:left;width:100%;transition:transform .15s ease,border-color .15s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.card:active{background:var(--surface-2)}
.chip:active,.day:active,.btn:active{opacity:.75}
.poster{width:92px;aspect-ratio:3/4;border-radius:12px;object-fit:cover;background:var(--surface-2);display:block;max-width:100%}
.poster.ph{display:grid;place-items:center;font-family:var(--f-display);font-size:28px;color:var(--muted)}
.c-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.c-title{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;margin:0;text-wrap:balance}
.c-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scores{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.score{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.score b{font-family:var(--f-mono);color:var(--fg);font-size:12.5px}
.star{color:var(--accent)}
.verdict{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--v) 16%,transparent);color:var(--v)}
.verdict::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--v)}
.times{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.t{font-family:var(--f-mono);font-weight:700;font-size:12.5px;padding:5px 8px;border-radius:8px;background:var(--surface-2);font-variant-numeric:tabular-nums;display:inline-flex;gap:4px;align-items:center}
.t sup{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.t.next{background:var(--accent);color:var(--accent-ink)}
.t.next sup{color:inherit;opacity:.75}
.t.past{opacity:.35;text-decoration:line-through}
.soon{font-size:12px;color:var(--accent);font-weight:600}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}

/* sheets */
.scrim{touch-action:none;position:fixed;inset:0;background:rgba(5,5,12,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;max-height:88%;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet.dragging{transition:none}
#locSheet{height:88%;height:88dvh}
.sheet-head,.grab{touch-action:none;cursor:grab}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 4px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.sheet-head h3{font-family:var(--f-display);font-size:21px;margin:0}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0;padding:0 max(18px,env(safe-area-inset-right,0px)) 22px max(18px,env(safe-area-inset-left,0px))}
.search{width:100%;padding:12px 14px 12px 40px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px!important;outline:none;-webkit-appearance:none;appearance:none}
input,select,textarea{font-size:16px!important}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.row:last-child{border-bottom:0}
.row .ico{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.row .ico.acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.row b{display:block;font-weight:600}
.row span{font-size:12.5px;color:var(--muted)}
.row .chk{margin-left:auto;color:var(--accent)}
.group-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 2px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:10px 12px;border-radius:12px;margin-top:10px}

/* film detail */
.d-top{display:grid;grid-template-columns:118px 1fr;gap:16px}
.d-top .poster{width:118px;border-radius:14px}
.d-title{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.05;margin:0 0 6px;text-wrap:balance}
.d-meta{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.advice{margin-top:16px;border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--v) 12%,var(--surface-2));border:1px solid color-mix(in srgb,var(--v) 35%,transparent)}
.advice .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--v);font-weight:700}
.advice h4{font-family:var(--f-display);font-size:20px;margin:2px 0 6px}
.advice p{margin:0;font-size:14px}
.bars{display:grid;gap:10px;margin-top:14px}
.bar-row{display:grid;grid-template-columns:92px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.bar-row b{font-family:var(--f-mono);text-align:right}
.bar-row small{grid-column:2/4;color:var(--muted);font-size:11.5px;margin-top:-6px}
.syn{font-size:14.5px;line-height:1.55;margin:16px 0 0;max-width:65ch}
.sec-t{font-family:var(--f-display);font-size:16px;margin:20px 0 8px}
.d-times{display:flex;flex-wrap:wrap;gap:8px}
.d-times .t{font-size:14px;padding:8px 10px}
.fx{font-size:9.5px;letter-spacing:.04em;padding:2px 4px;border-radius:4px;background:var(--bg);color:var(--muted)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.pass{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);text-decoration:none}
.pass .pi{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pass b{display:block;font-weight:600;font-size:14px}
.pass span{font-size:12.5px;color:var(--muted)}
.pass .go{margin-left:auto;color:var(--muted)}

@media (max-width:380px){.card{grid-template-columns:76px 1fr}.poster{width:76px}.d-top{grid-template-columns:96px 1fr}.d-top .poster{width:96px}.hero h1{font-size:24px}}
.rotate{display:none}
@media (orientation: landscape) and (max-height: 500px){.rotate{display:flex;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font-family:var(--f-display);font-size:18px}.rotate img{width:64px;height:64px;border-radius:15px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* ---------- v9: tabs, watchlist, history ---------- */
#scroller{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none!important}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;display:grid;place-items:center;font-family:var(--f-mono)}
.badge:empty{display:none}
.page-h{font-family:var(--f-display);font-weight:800;font-size:28px;margin:22px 0 4px;letter-spacing:-.01em}
.page-sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.mini{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;width:100%;text-align:left}
.mini .poster{width:64px;border-radius:10px}
.mini .poster.ph{font-size:22px}
.mini-b{min-width:0;display:flex;flex-direction:column;gap:4px}
.mini-t{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.15;margin:0}
.mini-s{font-size:12.5px;color:var(--muted)}
.mini-next{font-size:12.5px;font-weight:600;color:var(--accent)}
.mini-none{font-size:12.5px;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.stars{display:inline-flex;gap:2px}
.stars button{width:30px;height:30px;display:grid;place-items:center;color:var(--line)}
.stars button.on{color:var(--accent)}
.stars.sm button{width:22px;height:22px}
.stars svg{width:100%;height:100%}
.stars.sm svg{width:17px;height:17px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.act{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:13.5px}
.act svg{width:18px;height:18px}
.act.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.rate{margin-top:10px;padding:12px 14px;border-radius:16px;background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rate span{font-size:13px;color:var(--muted)}
.marks{display:flex;gap:6px}
.mark{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.mark.w{color:var(--accent)}
.mark svg{width:11px;height:11px}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chip.off{opacity:.5}
.loading{color:var(--muted)}
.ending{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.ending::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bad)}
.t.last{box-shadow:inset 0 0 0 1.5px var(--bad)}
.t.last sup.l{color:var(--bad);opacity:1}
.info-line{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13.5px;color:var(--muted)}
.info-line b{color:var(--fg);font-weight:600}
.info-line.warn{color:var(--bad)}.info-line.warn b{color:var(--bad)}
</style>
</head>
<body>
<div id="scroller">
<div class="app">
 <div class="view" id="viewShow">
  <header class="top">
    <img class="brand" src="icon.svg" alt="Klap" width="38" height="38">
    <button class="loc" id="locBtn" aria-haspopup="dialog">

        <span class="loc-name"><span id="locName">Rennes</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span></span>

<script>
(() => {
const VERSION = 10;
const QUICK = [["Paris",48.8566,2.3522],["Lyon",45.764,4.8357],["Marseille",43.2965,5.3698],["Toulouse",43.6047,1.4442],["Bordeaux",44.8378,-0.5792],["Nantes",47.2184,-1.5536],["Lille",50.6292,3.0573],["Rennes",48.1113,-1.68]];
const FX = {DOLBY_CINEMA:"DOLBY", E_4DX:"4DX", ICE:"ICE", LASER:"LASER", PLF:"GRAND ÉCRAN", F_4K:"4K", LUXURY:"CONFORT", DOLBY_ATMOS:"ATMOS", IMAX:"IMAX", E_3D:"3D"};
const KIDS = /Animation|Famille/;
const passCulture = q => `https://passculture.app/recherche/resultats?query=${encodeURIComponent('"'+q+'"')}&offerCategories=${encodeURIComponent('["CINEMA"]')}`;
const posterSrc = m => m && (m.img || (m.p ? "https://fr.web.img6.acsta.net/c_215_290" + m.p : null));
window.posterFail = img => { const d=document.createElement("div"); d.className="poster ph"; d.textContent=img.alt ? img.alt[0] : "?"; img.replaceWith(d); };
const $ = id => document.getElementById(id);
const store = { get(k){try{return JSON.parse(localStorage.getItem("seance:"+k))}catch(e){return null}}, set(k,v){try{localStorage.setItem("seance:"+k,JSON.stringify(v))}catch(e){}} };
const ICON = {
  star:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>`,
  save:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`,
  saved:`<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`,
  eye:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>`,
  trash:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`,
  pin:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`,
  film:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>`,
  clock:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  ok:`<svg class="chk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg>`
};

let INDEX = null;           // every cinema in France (cinemas.json)
const DEP = {}, DEP_P = {};  // department showtimes, loaded on demand
let DATA = null;            // what is on screen: nearby cinemas + their films
let WATCH = store.get("watch") || {};   // id -> {m, added}
let SEEN  = store.get("seen")  || {};   // id -> {m, rating, date}
const state = { loc: store.get("loc") || {kind:"city", name:"Rennes", lat:48.1113, lng:-1.6800}, cine:null, day:null, sort:"soon", tab:"Show", f:{vo:false,good:false,kids:false,ending:false} };

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const toMin = h => +h.slice(0,2)*60 + +h.slice(3,5);
const fr1 = x => x==null ? "–" : x.toFixed(1).replace(".",",");
const nf = new Intl.NumberFormat("fr-FR");
function km(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
const fmtKm = d => d<1 ? `${Math.round(d*1000/10)*10} m` : `${d<10?d.toFixed(1).replace(".",","):Math.round(d)} km`;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function dayLabel(iso){const t=isoDay(new Date());const tm=new Date();tm.setDate(tm.getDate()+1);
  const d=new Date(iso+"T12:00:00");
  const top = iso===t ? "Auj." : iso===isoDay(tm) ? "Demain" : d.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","");
  return {top: top[0].toUpperCase()+top.slice(1), sub: d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}).replace(".","")};}
const dayShort = iso => { const t=isoDay(new Date()); const tm=new Date(); tm.setDate(tm.getDate()+1); if(iso===t) return "ce soir"; if(iso===isoDay(tm)) return "demain"; return new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"}).replace(".",""); };
function inMin(m){ if(m<60) return `dans ${m} min`; const h=Math.floor(m/60), r=m%60; return `dans ${h} h${r?" "+pad(r):""}`; }
const posterImg = (m,cls="poster") => posterSrc(m) ? `<img class="${cls}" src="${posterSrc(m)}" alt="${esc(m.t)}" loading="lazy" referrerpolicy="no-referrer" onerror="posterFail(this)">` : `<div class="${cls} ph">${esc(((m&&m.t)||"?")[0])}</div>`;
const starsHtml = (n, id, sm) => `<span class="stars${sm?" sm":""}">${[1,2,3,4,5].map(i=>`<button data-rate="${id}" data-n="${i}" class="${i<=n?"on":""}" aria-label="${i} sur 5">${ICON.star}</button>`).join("")}</span>`;

/* ---------- verdict ---------- */
function verdict(m){
  const p=m.pr, u=m.u, pc=m.pc||0, uc=m.uc||0;
  if(p==null && (u==null || uc<15)) return {key:"none", label:"Pas encore noté", color:"var(--none)", score:null,
    title:"Trop tôt pour juger", text:"Le film n'a pas encore assez de notes pour qu'on puisse le recommander. Fie-toi au synopsis et à la bande-annonce."};
  const wu = u==null ? 0 : Math.min(1, uc/200)*0.5;
  const wp = p==null ? 0 : Math.min(1, pc/8)*0.5;
  const s = (wp+wu) ? ((p??0)*wp + (u??0)*wu)/(wp+wu) : (p??u);
  let v;
  if(s>=4.1) v={key:"must",label:"Incontournable",color:"var(--good)",title:"Fonce, c'est un grand film"};
  else if(s>=3.6) v={key:"great",label:"Très bon choix",color:"var(--good)",title:"Très bon choix"};
  else if(s>=3.1) v={key:"good",label:"Bon film",color:"var(--ok)",title:"Une bonne séance"};
  else if(s>=2.6) v={key:"mixed",label:"Mitigé",color:"var(--mid)",title:"Avis partagés"};
  else v={key:"bad",label:"À éviter",color:"var(--bad)",title:"Plutôt à éviter"};
  const parts=[];
  if(p!=null && u!=null){
    const gap=u-p;
    if(Math.abs(gap)<0.5) parts.push(`La presse (${fr1(p)}/5) et le public (${fr1(u)}/5) sont d'accord.`);
    else if(gap>0) parts.push(`Le public (${fr1(u)}/5) l'aime bien plus que la presse (${fr1(p)}/5) : un film qui plaît en salle plus qu'aux critiques.`);
    else parts.push(`La presse (${fr1(p)}/5) est plus enthousiaste que le public (${fr1(u)}/5) : plutôt un film d'auteur ou exigeant.`);
  } else if(p!=null) parts.push(`Seule la presse l'a noté pour l'instant : ${fr1(p)}/5 sur ${pc} critique${pc>1?"s":""}.`);
  else parts.push(`Le public lui donne ${fr1(u)}/5 sur ${nf.format(uc)} notes. Pas encore de critiques presse.`);
  const tail = {must:"Une des meilleures séances du moment.", great:"Tu devrais passer un très bon moment.", good:"Une séance solide, surtout si le genre te plaît.", mixed:"À voir si le sujet t'attire vraiment.", bad:"Les notes sont mauvaises des deux côtés : il y a sûrement mieux à l'affiche."}[v.key];
  parts.push(tail);
  return {...v, score:s, text:parts.join(" ")};
}

/* ---------- data: all of France, loaded around you ---------- */
function getDep(d){
  if(!DEP_P[d]) DEP_P[d] = fetch(`data/${d}.json`).then(r=>r.ok?r.json():null).then(x=>{DEP[d]=x;}).catch(()=>{DEP[d]=null;});
  return DEP_P[d];
}
async function loadNearby(){
  const near = INDEX.map(c=>({...c, dist:km(state.loc,c)})).sort((a,b)=>a.dist-b.dist);
  let pick = near.filter(c=>c.dist<=30).slice(0,40);
  if(pick.length<10) pick = near.slice(0,10);
  if(state.cine && !pick.some(c=>c.id===state.cine)){ const c=near.find(x=>x.id===state.cine); if(c) pick.push(c); }
  const deps = [...new Set(pick.map(c=>c.dep))];
  await Promise.all(deps.map(getDep));
  const movies={}; let days=[], updated=null;
  deps.forEach(d=>{ const x=DEP[d]; if(!x) return; Object.assign(movies,x.movies); if(x.days.length>days.length) days=x.days; if(!updated||x.updated>updated) updated=x.updated; });
  DATA = {days, movies, updated, cinemas: pick.map(c=>({...c, days:(DEP[c.dep] && DEP[c.dep].cinemas[c.id]) || {}}))};
}
const hasShows = c => Object.keys(c.days).length>0;
function endInfo(c, id){
  const ds=Object.keys(c.days).sort(); if(!ds.length) return null;
  const mine=ds.filter(d=>c.days[d][id]); if(!mine.length) return null;
  const last=mine[mine.length-1];
  if(last>=ds[ds.length-1]) return null;          // still there on the last published day
  const ss=c.days[last][id]; return {day:last, h:ss[ss.length-1].h};
}
function cinemasByDistance(){ return DATA.cinemas.map(c=>({...c, dist:km(state.loc,c)})).sort((a,b)=>a.dist-b.dist); }
function availableDays(){ const today=isoDay(new Date()); return DATA.days.filter(d=>d>=today); }
function sessionsFor(c, day){
  const entries = Object.entries(c.days[day]||{});
  const isToday = day===isoDay(new Date()); const nm=nowMin();
  return entries.map(([id,ss])=>{
    const m=DATA.movies[id]; if(!m) return null; let list=ss;
    if(state.f.vo) list=list.filter(s=>s.v==="VO");
    const upcoming = isToday ? list.filter(s=>toMin(s.h)>=nm-5) : list;
    return {id, m, v:verdict(m), all:list, upcoming, next: upcoming[0], end:endInfo(c,id)};
  }).filter(x=>x && x.all.length && x.upcoming.length)
    .filter(x=>!state.f.good || (x.v.score!=null && x.v.score>=3.5))
    .filter(x=>!state.f.kids || KIDS.test((x.m.g||[]).join(" ")))
    .filter(x=>!state.f.ending || x.end);
}
/* next showing of a film in the cinemas around you */
function nextShowing(id){
  if(!DATA) return null;
  const today=isoDay(new Date()), nm=nowMin(); let best=null, count=0;
  for(const c of cinemasByDistance()){
    let found=null;
    for(const d of DATA.days){ if(d<today) continue;
      const ss=(c.days[d]||{})[id]; if(!ss) continue;
      const s=ss.find(s=>d!==today || toMin(s.h)>=nm-5); if(s){ found={c,d,s}; break; } }
    if(found){ count++; if(!best || found.d<best.d || (found.d===best.d && found.s.h<best.s.h && found.c.dist<best.c.dist+15)) best=found; }
  }
  return best ? {...best, count} : null;
}

/* ---------- render: Séances ---------- */
function renderTop(){
  $("locName").textContent = state.loc.name;
  $("locLabel").textContent = state.loc.kind==="gps" ? "Autour de moi" : "Ma position";
}
function renderHero(){
  const list = cinemasByDistance();
  if(!state.cine || !list.find(c=>c.id===state.cine)) state.cine = (list.find(hasShows) || list[0]).id;
  const c = list.find(x=>x.id===state.cine);
  const nearest = c.id===(list.find(hasShows)||list[0]).id;
  $("heroEyebrow").textContent = !nearest ? "Cinéma choisi" : "Cinéma le plus proche";
  $("cineName").textContent = c.name;
  $("cineMeta").innerHTML = `<span><b>${fmtKm(c.dist)}</b> de ${esc(state.loc.name)}</span><span>${esc(c.addr||c.town)}</span>`;
  const maps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.name+" "+(c.addr||c.town))}`;
  $("cineActions").innerHTML = `<a class="btn primary" href="https://www.allocine.fr/seance/salle_gen_csalle=${c.id}.html" target="_blank" rel="noopener">Réserver
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
    <a class="btn" href="${maps}" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-8-8 18-2-8z"/></svg>Itinéraire</a>
    <a class="btn" href="${passCulture(c.name)}" target="_blank" rel="noopener">pass Culture</a>`;
  $("cineStrip").innerHTML = list.slice(0,12).map(x=>`<button class="chip${hasShows(x)?"":" off"}" data-cine="${x.id}" aria-pressed="${x.id===c.id}">${esc(x.name)} <small>${fmtKm(x.dist)}</small></button>`).join("");
  return c;
}
function renderDays(c){
  const days = availableDays();
  if(!state.day || !days.includes(state.day)) state.day = days.find(d=>sessionsFor(c,d).length) || days[0];
  $("days").innerHTML = days.map(d=>{const l=dayLabel(d);const has=Object.keys(c.days[d]||{}).length>0;
    return `<button class="day" data-day="${d}" aria-pressed="${d===state.day}" ${has?"":"disabled"}><b>${l.top}</b><span>${l.sub}</span></button>`}).join("");
}
function marks(id){
  const w=WATCH[id], s=SEEN[id];
  if(!w && !s) return "";
  return `<span class="marks">${w?`<span class="mark w">${ICON.saved} À voir</span>`:""}${s?`<span class="mark">${ICON.check} Vu${s.rating?` · ${s.rating}★`:""}</span>`:""}</span>`;
}
function card(x){
  const m=x.m, v=x.v, isToday=state.day===isoDay(new Date()), nm=nowMin();
  const lastHere = x.end && x.end.day===state.day ? x.end.h : null;
  const times = x.all.map(s=>{const past=isToday && toMin(s.h)<nm-5; const next=s===x.next && isToday; const last=s.h===lastHere;
    return `<span class="t${past?" past":""}${next?" next":""}${last?" last":""}">${s.h}${s.v==="VO"?"<sup>VO</sup>":""}${last?'<sup class="l">DERNIÈRE</sup>':""}</span>`}).join("");
  const endBadge = x.end ? `<span class="ending">${x.end.day===isoDay(new Date())?"Dernier jour":"Jusqu'à "+dayShort(x.end.day)}</span>` : "";
  const soon = isToday && x.next ? `<span class="soon">Prochaine ${inMin(Math.max(0,toMin(x.next.h)-nm))}</span>` : "";
  return `<button class="card" data-film="${x.id}">
    ${posterImg(m)}
    <div class="c-body">
      <h3 class="c-title">${esc(m.t)}</h3>
      <div class="c-sub">${esc([m.rt&&m.rt!=="0h 00min"?m.rt.replace(" ",""):null,(m.g||[]).slice(0,2).join(", ")].filter(Boolean).join(" · "))}</div>
      <div class="scores">
        <span class="verdict" style="--v:${v.color}">${v.label}</span>
        ${m.pr!=null?`<span class="score">Presse <b>${fr1(m.pr)}</b></span>`:""}
        ${m.u!=null?`<span class="score">Public <b>${fr1(m.u)}</b><span class="star">★</span></span>`:""}

function searchPlaces(q){
  clearTimeout(searchTimer); PLACES=[];
  if(q.trim().length<2){ renderLocList(q); return; }
  renderLocList(q);
  const seq=++searchSeq;
  searchTimer=setTimeout(()=>{
    fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&type=municipality&limit=6`).then(r=>r.json()).then(j=>{
      if(seq!==searchSeq) return;
      PLACES=(j.features||[]).map(f=>({name:f.properties.city||f.properties.name, ctx:[f.properties.postcode,(f.properties.context||"").split(", ").slice(1).join(", ")].filter(Boolean).join(" · "), lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]}));

    }).catch(()=>{ if(seq===searchSeq) $("locList").innerHTML=`<div class="note">Recherche impossible sans connexion. Réessaie dans un instant.</div>`; });
  },250);
}

function locate(silent){

      if(silent && (store.get("loc") || document.querySelector(".sheet.open"))) return;
      const here={lat:p.coords.latitude,lng:p.coords.longitude}; let name="Ma position";
      try{ const j=await (await fetch(`https://api-adresse.data.gouv.fr/reverse/?lon=${here.lng}&lat=${here.lat}&type=municipality`)).json(); if(j.features&&j.features[0]) name=j.features[0].properties.city||name; }catch(e){}
      setLoc({kind:"gps",name,...here}); }, fail, {timeout:7000,maximumAge:300000});
  }catch(e){ fail(); }
}
$("gpsBtn").onclick=()=>locate(false);

/* no zoom, ever: pinch, double tap, or the auto-zoom on a text field */
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{ if(e.touches.length>1 && e.cancelable) e.preventDefault(); },{passive:false});
let lastTap=0, lastEl=null;
document.addEventListener("touchend",e=>{ const now=Date.now(); if(now-lastTap<300 && e.target===lastEl && !e.target.closest("input,textarea") && e.cancelable) e.preventDefault(); lastTap=now; lastEl=e.target; },{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
["gesturestart","gesturechange"].forEach(t=>window.addEventListener(t,e=>e.preventDefault(),{passive:false}));
const pinTop=()=>{ if(window.scrollY||window.scrollX) window.scrollTo(0,0); };
window.addEventListener("scroll",pinTop,{passive:true});
document.addEventListener("focusin",()=>setTimeout(pinTop,0));
if(window.visualViewport) visualViewport.addEventListener("scroll",pinTop);
const vpMeta=document.querySelector('meta[name="viewport"]');
function resetZoom(){ if(!vpMeta) return; const c=vpMeta.content; vpMeta.content=c.replace("maximum-scale=1","maximum-scale=1.0"); requestAnimationFrame(()=>{ vpMeta.content=c; }); }
document.addEventListener("focusout",e=>{ if(e.target.matches("input,textarea")) setTimeout(resetZoom,50); });
if(window.visualViewport) visualViewport.addEventListener("resize",()=>{ if(visualViewport.scale>1.01 && !document.activeElement.matches("input,textarea")) resetZoom(); });

/* clock: time-dependent bits follow the minute */
function tick(){ const d=new Date(); $("clock").textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`; }
tick(); let lastMin=nowMin();
setInterval(()=>{ tick(); const n=nowMin(); if(n!==lastMin){ lastMin=n; if(!document.querySelector(".sheet.open")) renderAll(); } }, 15000);

/* start */
renderTop(); renderWatch();
fetch("cinemas.json").then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(async idx=>{ INDEX=idx; await loadNearby(); renderAll(); if(!store.get("loc") && navigator.geolocation) locate(true); })
  .catch(()=>{ $("cineName").textContent="Séances indisponibles"; $("list").innerHTML=`<div class="empty"><b>Impossible de charger les cinémas</b>Vérifie ta connexion et rouvre Klap.</div>`; });
})();
</script>
